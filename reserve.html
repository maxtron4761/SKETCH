<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reserve a Table — Sketch Cafe</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jacques+Francois+Shadow&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/reserve.css">
</head>
<body>
  <header class="site-header">
    <div class="container site-header__inner">
      <a class="brand" href="index.html">
        <span class="brand__name"><span>&#9749;</span>Sketch Cafe</span>
        <span class="brand__sub">BY APOLLO SINDOORI</span>
      </a>
      <nav class="nav" aria-label="Main">
        <a href="index.html">Home</a>
        <a href="menu.html">Menu</a>
       <a href="contact.html">Contact</a>
</nav>

<div class="header-actions">
        <a class="cart-pill" href="cart.html" aria-label="View cart">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.7 13.4a2 2 0 0 0 2 1.6h9.7a2 2 0 0 0 2-1.6L23 6H6"/></svg>
          Cart <span class="cart-pill__count">0</span>
        </a>
        <a class="btn btn--primary btn--sm" href="reserve.html">Reserve Table</a>
        <a class="avatar" href="login.html" aria-label="Sign in">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        </a>
      </div>
    </div>
  </header>
  <main class="reserve">
    <h1>Reserve a Table</h1>
    <section class="reserve__card">
      <div class="reserve__head">
        <h2>Reservation Details</h2>
        <span>Instant Confirmation</span>
      </div>
    <form id="reservationForm">

    <div class="form-grid">

        <div class="field">
            <label for="name">Full Name *</label>
            <input type="text" id="name" name="name"
                   placeholder="Enter your name" required>
        </div>

        <div class="field">
            <label for="date">Date *</label>
            <input id="date" name="date" type="date" required>
        </div>

        <div class="field">
            <label for="party">Party Size *</label>
            <select id="party" name="guests" required>
                <option value="" disabled selected>Select party size...</option>
                <option value="1">1 Guest</option>
                <option value="2">2 Guests</option>
                <option value="3">3 Guests</option>
                <option value="4">4 Guests</option>
                <option value="5">5 Guests</option>
                <option value="6">6 Guests</option>
                <option value="7">7 Guests</option>
                <option value="8">8 Guests</option>
                <option value="9">9 Guests</option>
                <option value="10">10 Guests</option>
            </select>
        </div>

        <div class="field">
            <label for="time">Time Slot *</label>
            <select id="time" name="time" required>
                <option value="" disabled selected>Select time...</option>
                <option>08:00 AM</option>
                <option>09:00 AM</option>
                <option>10:00 AM</option>
                <option>11:00 AM</option>
                <option>12:30 PM</option>
                <option>01:30 PM</option>
                <option>02:30 PM</option>
                <option>07:30 PM</option>
                <option>08:30 PM</option>
                <option>09:30 PM</option>
            </select>
        </div>

        <div class="field">
            <label for="seat">Seating Preference</label>
            <select id="seat" name="seating">
                <option value="Indoor">Indoor</option>
                <option value="Outdoor">Outdoor</option>
                <option value="Window side">Window side</option>
                <option value="Quiet corner">Quiet corner</option>
            </select>
        </div>

    </div>

    <div class="field">
        <label for="remail">Email Address *</label>
        <input id="remail" name="email" type="email"
               placeholder="name@example.com" required>
    </div>

    <div class="field">
        <label for="notes">Special Notes or Dietary Preferences</label>
        <textarea id="notes" name="notes" rows="3"
                  placeholder="Any special requests?"></textarea>
    </div>

    <p id="reservationMessage" role="status"></p>

    <button class="reserve__submit" type="submit">
        Confirm Table Reservation →
    </button>

</form>
    </section>
  </main>
  <footer class="site-footer" id="contact">
    <div class="container site-footer__inner">
      <p>&copy; 2025 Sketch Cafe by Apollo Sindoori. All rights reserved.</p>
      <p class="site-footer__tag">ARTISANAL DINING &amp; SLOW BREWS</p>
    </div>
  </footer>
  <script src="js/reservation.js"></script>
</body>
</html>
