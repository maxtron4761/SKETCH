<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Your Cart — Sketch Cafe</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jacques+Francois+Shadow&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/cart.css">
</head>
<body>
  <header class="site-header">
    <div class="container site-header__inner">
      <a class="brand" href="index.html">
        <span class="brand__name"><span>&#9749;</span>Sketch Cafe</span>
        <span class="brand__sub">BY APOLLO SINDOORI</span>
      </a>
      <nav class="nav" aria-label="Main">
    <a href="index.html">Home</a>
    <a href="menu.html">Menu</a>
    <a href="contact.html">Contact</a>
</nav>
      <div class="header-actions">
        <a class="cart-pill" href="cart.html" aria-label="View cart">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.7 13.4a2 2 0 0 0 2 1.6h9.7a2 2 0 0 0 2-1.6L23 6H6"/></svg>
          Cart <span class="cart-pill__count">4</span>
        </a>
        <a class="btn btn--primary btn--sm" href="reserve.html">Reserve Table</a>
        <a class="avatar" href="login.html" aria-label="Sign in">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        </a>
      </div>
    </div>
  </header>
  <main class="container cart">
    <h1 class="page-title">Your Cart</h1>

    <div class="cart__grid">
        <section class="cart__items" aria-label="Order items">

            <div id="cartItems"></div>

            <p id="emptyCart" style="display:none;">
                Your cart is empty!
            </p>

            <a class="back-link" href="menu.html">
                &larr; Continue Shopping
            </a>

        </section>

        <aside class="summary">
            <h2>Order Summary</h2>

            <div class="summary__total">
                <div>
                    <strong>Subtotal</strong>
                    <small>GST calculated at checkout</small>
                </div>

                <span id="cartSubtotal">&#8377;0.00</span>
            </div>

            <a class="btn btn--primary cta" href="checkout.html">
                Proceed to Payment <span aria-hidden="true">&rarr;</span>
            </a>
        </aside>
    </div>
</main>
  <footer class="site-footer" id="contact">
    <div class="container site-footer__inner">
      <p>&copy; 2025 Sketch Cafe by Apollo Sindoori. All rights reserved.</p>
      <p class="site-footer__tag">ARTISANAL DINING &amp; SLOW BREWS</p>
    </div>
  </footer>
  <script src="js/cart.js"></script>
</body>
</html>
